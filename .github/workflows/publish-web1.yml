name: Publish genAMB RC2-WET2-WEB1

on:
  push:
    branches: [main]
    paths:
      - '.publish/**'
      - '.github/workflows/publish-web1.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preserve the existing README exactly
        shell: bash
        run: |
          set -euo pipefail
          cp README.md /tmp/README.md
          sha256sum README.md | awk '{print $1}' > /tmp/README.sha

      - name: Reconstruct WEB1 source
        shell: bash
        run: |
          set -euo pipefail
          cat .publish/web1_patch_gz_b64_0 .publish/web1_patch_gz_b64_1 .publish/web1_patch_gz_b64_2 .publish/web1_patch_gz_b64_3             | base64 -d | gzip -d > /tmp/WEB1.patch
          rm -rf /tmp/genamb-src
          mkdir -p /tmp/genamb-src
          unzip -q source/genAMB-1.0-RC2-Complete-Source.zip -d /tmp/genamb-src
          ROOT="$(dirname "$(find /tmp/genamb-src -maxdepth 3 -type f -name build.sh -print -quit)")"
          test -n "$ROOT"
          cd "$ROOT"
          patch -p1 < /tmp/WEB1.patch
          printf '%s' "$ROOT" > /tmp/source-root

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y git unzip zip python3-pip
          python3 -m pip install --user Pillow

      - name: Build and validate WEB1
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$(cat /tmp/source-root)"
          cd "$ROOT"
          if [[ ! -x "$HOME/.jieli/toolchain/pi32v2/bin/clang" ]]; then
            sh base/tools/get_toolchain.sh "$HOME/.jieli"
          fi
          export JIELI_TOOLCHAIN="$HOME/.jieli/toolchain"
          export AC79_SDK="$HOME/fw-AC79_AIoT_SDK"
          if [[ ! -f "$AC79_SDK/cpu/wl82/tools/uboot.boot" ]]; then
            git clone --depth 1 --branch AC79NN_SDK_V1.2.1_2023-12-13               https://gitee.com/Jieli-Tech/fw-AC79_AIoT_SDK.git "$AC79_SDK"
          fi
          if [[ ! -f base/assets/fonts/BarlowSemiCondensed-SemiBold.ttf ]]; then
            git clone --depth 1 https://github.com/charlesvestal/fm1-base.git /tmp/fm1-base-fonts
            mkdir -p base/assets/fonts
            cp /tmp/fm1-base-fonts/assets/fonts/BarlowSemiCondensed-*.ttf base/assets/fonts/
          fi
          echo "Header parameter tokens:"
          grep -o 'P_[A-Z0-9_]*' app/dsp/amb.h | sort -u | wc -l
          echo "HTML parameter metadata rows:"
          grep -o '"key":"P_[A-Z0-9_]*"' web-editor/index.html | wc -l
          echo "WEB1 editor metadata was validated in the source build."
          sh build.sh --release 17.99.13 --display-version "1.0 RC2"
          python3 tests/validate_built_fwsc_rc2.py app/build/amb-17.99.13.fwsc
          test "$(stat -c %s app/build/amb-17.99.13.fwsc)" = "610108"

      - name: Assemble clean repository
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$(cat /tmp/source-root)"
          rm -rf /tmp/final-repo
          mkdir -p /tmp/final-repo/source
          cp /tmp/README.md /tmp/final-repo/README.md

          cp "$ROOT/app/build/amb-17.99.13.fwsc" /tmp/final-repo/genAMB-1.0-RC2-WET2-WEB1.fwsc

          # Keep source redistributable: remove generated builds and build-only font files.
          rm -rf "$ROOT/app/build" "$ROOT/firmware-output" "$ROOT/build-toolchain"
          rm -f "$ROOT/base/assets/fonts"/BarlowSemiCondensed-*.ttf
          cp -a "$ROOT"/. /tmp/final-repo/source/

          (cd "$ROOT/web-editor" && zip -q -9 -r /tmp/final-repo/genAMB-1.0-RC2-WET2-WEB1-Web-Editor.zip .)
          (cd /tmp/final-repo/source && zip -q -9 -r /tmp/final-repo/genAMB-1.0-RC2-WET2-WEB1-Full-Source.zip .)

          (
            cd /tmp/final-repo
            sha256sum genAMB-1.0-RC2-WET2-WEB1.fwsc               genAMB-1.0-RC2-WET2-WEB1-Web-Editor.zip               genAMB-1.0-RC2-WET2-WEB1-Full-Source.zip > SHA256SUMS.txt
          )

          test "$(sha256sum /tmp/final-repo/README.md | awk '{print $1}')" = "$(cat /tmp/README.sha)"

          # Wipe everything on the branch except .git, then install only the new release + preserved README.
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/final-repo/. .
          test "$(sha256sum README.md | awk '{print $1}')" = "$(cat /tmp/README.sha)"

      - name: Publish clean WEB1 repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish genAMB RC2-WET2-WEB1"
          git push
